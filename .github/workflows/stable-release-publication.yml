name: Stable Release Publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Green stable version to publish (for example 0.21.5)'
        required: false
        type: string
        default: ''
  # Stable Release's own final job reconciles while its workflow is still
  # running, so that pass can observe the run as "running" and plan nothing.
  # Every completed dispatched run is reconciled again here: a success closes
  # that gap, and a failure also reruns its failed jobs immediately.
  workflow_run:
    workflows: ['Stable Release']
    types: [completed]

# Shared with Stable Release so publication never races a build. The requested
# rerun waits as pending behind this job instead of deadlocking it: the
# sequencer only confirms the new attempt is queued, never that it finished.
concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # GitHub-hosted with docker/setup-buildx-action, as before the runner migration: on
    # Blacksmith `imagetools create` cannot commit a manifest list to Docker Hub (404 on the
    # index commit, any buildx version): v0.22.3 rc.1-rc.4 died on it in the versioned manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - name: Set up Docker Buildx for ordered alias promotion
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub for ordered alias promotion
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reconcile stable drafts and Docker aliases
        run: python -m scripts.releases.sequencer
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
