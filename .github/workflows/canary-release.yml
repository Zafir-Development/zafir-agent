name: Canary Release

# Automatic canaries are daily: the schedule caps new tags at one per 24h.
# With no new commits, release.py publishes the existing unpublished canary
# receipt; only a published canary makes a quiet day a no-op.
# workflow_dispatch fires one on demand at any time.
#
# A source-only canary is the annotated tag plus its published GitHub
# prerelease — nothing is built, so both happen in this job immediately.
# Source identity is the exact stable version plus build metadata:
# v<stable>+canary.<YYYYMMDDTHHMMSSZ>. It compares equal to the stable.
# A dispatch queued behind a running canary has conclusion=cancelled if a
# newer one supersedes it; only conclusion=failure is a canary failure signal.

on:
  schedule:
    - cron: "41 6 * * *" # daily, 06:41 UTC
  workflow_dispatch:

permissions:
  contents: write # tag push + release create/publish/delete

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and publish the source canary
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A dispatch from a feature branch would tag unmerged code as the canary.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          # The changelog walks commits since the previous canary tag
          fetch-depth: 0
          # the tag math reads the full tag list
          fetch-tags: true

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --canary --publish --remote origin

  prune:
    name: Prune canaries older than 14 days
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: tag
    # Prune even when this run had nothing new to tag. The window is 14 days,
    # far wider than one run.
    if: always() && needs.tag.result != 'cancelled' && needs.tag.result != 'skipped'
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --prune-canaries --publish --remote origin
