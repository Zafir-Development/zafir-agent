# Reusable runner for ONE macOS install/update combination.
#
#   e2e (script arm)        tests/install/installer-script-e2e.sh - the
#                           OS-agnostic git-redirect driver shared with
#                           linux. installer-script installs;
#                           script/updater/hermes-desktop-app-update
#                           updates.
#
# Method pairs without a driver arm yet NATIVELY SKIP (grey check, no
# runner): the capability knowledge lives here, next to the drivers.

name: install-e2e macos leg

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      install-method:
        description: 'How OLD gets installed. Supported: installer-script (the curl | bash one-liner).'
        required: true
        type: string
      update-method:
        description: 'How the install updates to HEAD. Supported: hermes-update, installer-script (re-run the one-liner), hermes-desktop-app-update (source-mode app launched by hermes desktop).'
        required: true
        type: string
      install-ref:
        description: 'What to install before updating: a branch, a tag, or a SHA reachable from main.'
        required: false
        type: string
        default: refs/heads/main
      update-ref:
        description: 'What to update TO: HEAD (the commit under test), or NEXT -- a synthetic child of install-ref that the driver mints, so a leg that installs HEAD still has an update to take (HEAD''s own updater).'
        required: false
        type: string
        default: HEAD
      tag-has-desktop:
        description: "Whether install-ref ships the desktop app (apps/desktop). The caller annotates this from the tag's own tree; the app-update leg from a pre-desktop release natively skips."
        required: false
        type: boolean
        default: true
      leg-id:
        description: 'Artifact-safe matrix leg id (from generate-e2e-matrix.mjs legId). Names this leg''s logs + player artifacts so the report job can link a row to its zip.'
        required: true
        type: string
      timeout-minutes:
        description: 'Job timeout. App-update legs do a full Electron build.'
        required: false
        type: number
        default: 60

permissions:
  contents: read

env:
  # A stable run is on the default branch, so GITHUB_SHA is not the commit under test.
  HERMES_TESTED_COMMIT: ${{ inputs.commit || github.sha }}

jobs:
  # ---- arm 1: script installs (the shared OS-agnostic driver) --------------
  e2e:
    name: install & update
    if: >-
      inputs.install-method == 'installer-script'
      && (contains(fromJSON('["hermes-update", "installer-script"]'), inputs.update-method)
        || (inputs.update-method == 'hermes-desktop-app-update' && inputs.tag-has-desktop))
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      commit: ${{ inputs.commit }}
      install-method: ${{ inputs.install-method }}
      update-method: ${{ inputs.update-method }}
      install-ref: ${{ inputs.install-ref }}
      update-ref: ${{ inputs.update-ref }}
      tag-has-desktop: ${{ inputs.tag-has-desktop }}
      leg-id: ${{ inputs.leg-id }}
      runner: blacksmith-6vcpu-macos-latest
      timeout-minutes: ${{ inputs.timeout-minutes }}
